name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # tests/classic.rs and tests/persistent.rs fail instead of skipping when
  # php-cgi or the PHP CLI is missing; the PSR-7 test needs php/worker/vendor.
  RPHP_REQUIRE_PHP: "1"
  RPHP_REQUIRE_PSR7: "1"

jobs:
  test:
    name: test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: php-cgi -v
      - run: php -v
      - name: Install rphp/worker dev dependencies (PSR-7 test)
        run: composer install --no-interaction --no-progress
        working-directory: php/worker
      - run: cargo test

      # End-to-end preflight against the real interpreter.
      - name: rphp check
        run: cargo run -- check --config rphp.example.toml

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
