# RPHP configuration. Copy to `rphp.toml` and adjust.
# Every key is optional; the values below are the built-in defaults.
# Relative paths are resolved against the directory containing this file.
# Unknown keys are rejected so that typos fail loudly.

[server]
# Loopback by default. Binding to 0.0.0.0 exposes the server to the network.
host = "127.0.0.1"
port = 8080
document_root = "public"
# Front controller, relative to document_root. Must stay inside it.
entry_point = "index.php"
# Largest request body accepted (8 MiB); larger bodies get 413.
max_body_bytes = 8388608
# How long shutdown waits for in-flight connections to finish.
shutdown_timeout_ms = 10000
# How long a client may take to send its request headers (slowloris guard).
header_read_timeout_ms = 30000

[php]
# Name on PATH or a path to the interpreter. Classic mode uses the FastCGI
# SAPI, so php-cgi is expected. PHP 8.4 is the fixed minimum version, and
# releases with known critical vulnerabilities (e.g. 8.4 < 8.4.27) are refused.
binary = "php-cgi"

[worker]
# "classic" (php-cgi over FastCGI) or "persistent" (experimental: PHP CLI
# workers that boot the app once; see docs/persistent-mode.md). Persistent
# mode also needs `script = "worker.php"` and `[php] binary = "php"`.
mode = "classic"
count = 4
# Requests a PHP process serves before it is recycled
# (php-cgi's PHP_FCGI_MAX_REQUESTS in classic mode).
max_requests = 1000
# Deadline for a whole request: reading the body, waiting for a worker and
# running PHP. Exceeded: 504, and the worker is killed and replaced.
request_timeout_ms = 30000
# Requests allowed to wait for a free worker; beyond that, 503 + Retry-After.
max_queue_size = 256
# Optional, off by default:
# max_age_secs = 3600     # recycle workers after this long (both modes)
# max_memory_mb = 128     # persistent mode: recycle above this memory_get_usage()
# script = "worker.php"   # persistent mode: the rphp/worker script

[admin]
# Separate listener for /health and /metrics. When disabled, both are served
# on the application listener (and shadow application routes of the same
# path). Enable it before binding [server] to a non-loopback address.
enabled = false
host = "127.0.0.1"
port = 9180
